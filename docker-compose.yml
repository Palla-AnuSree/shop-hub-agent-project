services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shophub
      POSTGRES_PASSWORD: shophub
      POSTGRES_DB: shophub
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shophub -d shophub"]
      interval: 5s
      timeout: 3s
      retries: 20

  store-api:
    build: .
    command: uvicorn store_api.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]

  orders-agent:
    build: .
    command: uvicorn orders_agent.main:app --host 0.0.0.0 --port 8002
    environment:
      STORE_API_URL: http://store-api:8001
    depends_on:
      - store-api
    ports: ["8002:8002"]

  orchestrator:
    build: .
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000
    environment:
      LLM_MODE: ${LLM_MODE:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      STORE_API_URL: http://store-api:8001
      ORDERS_AGENT_URL: http://orders-agent:8002
      DATABASE_URL: postgresql://shophub:shophub@postgres:5432/shophub
    depends_on:
      postgres:
        condition: service_healthy
      store-api:
        condition: service_started
      orders-agent:
        condition: service_started
    ports: ["8000:8000"]
